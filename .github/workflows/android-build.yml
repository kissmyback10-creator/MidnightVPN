name: Android Build & Release

on:
  push:
    branches: [ main, base-branch ]
  pull_request:
    branches: [ main, base-branch ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MidnightVPN-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MidnightVPN-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/base-branch') && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: MidnightVPN v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          body: |
            ## MidnightVPN v${{ steps.version.outputs.version }}

            ### Features
            - Auto-discovery of free VPN servers via VPN Gate API
            - Real-time ping sorting for optimal server selection
            - Premium dark UI with glassmorphism and neon glow effects
            - Kill Switch & Split Tunneling support
            - Live connection speed stats and public IP display

            ### Install
            Download `app-release-unsigned.apk` below and install on your Android device (Min SDK 24 / Android 7.0+).
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
